services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smp
      POSTGRES_PASSWORD: smp
      POSTGRES_DB: smp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smp"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn smp.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://smp:smp@db:5432/smp
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  # Heavy / flaky part: scrape + ingest. Run on demand, from an Israeli IP:
  #   docker compose run --rm worker smp scrape --chains SHUFERSAL RAMI_LEVY --limit 20
  #   docker compose run --rm worker smp ingest --path /data/dumps
  worker:
    build:
      context: .
      args: {WITH_SCRAPER: "1"}
    environment:
      DATABASE_URL: postgresql+psycopg2://smp:smp@db:5432/smp
      DUMPS_DIR: /data/dumps
    volumes: [./dumps:/data/dumps]
    depends_on:
      db: {condition: service_healthy}
    profiles: ["worker"]

volumes:
  pgdata:
